name: 매일 0시 블로그 다시 만들기
on:
  schedule:
    - cron: '5 15 * * *'   # 한국 시간 00:05
  push:
    branches: [main]
    paths: ['content/**', 'web/**', 'build.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python3 build.py
      - run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || (git commit -m "블로그 다시 만들기 $(TZ=Asia/Seoul date '+%F %H:%M')" && git push)
